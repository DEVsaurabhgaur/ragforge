[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ragforge"
version = "2.0.0"
description = "Intelligent Multi-Document Q&A powered by RAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
